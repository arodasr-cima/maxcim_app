<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="description" content="MAXCIM, entorno demostrativo de acompañamiento sociocomunicativo.">
  <title>{% block title %}MAXCIM{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="auth-page">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="auth-flashes" role="status" aria-live="polite">
        {% for category, message in messages %}
          <div class="auth-flash auth-flash--{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
