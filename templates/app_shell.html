<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SocioComunica{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
  <div class="app-shell">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <div class="sidebar__logo">SC</div>
        <div class="sidebar__name">SocioComunica</div>
      </div>

      <nav class="sidebar__nav">
        <a href="{{ url_for('dashboard') }}" class="sidebar__link {{ 'sidebar__link--active' if active_nav == 'tablon' else '' }}">
          <span class="sidebar__icon">🏠</span>Tablón
        </a>
        <a href="{{ url_for('material') }}" class="sidebar__link {{ 'sidebar__link--active' if active_nav == 'material' else '' }}">
          <span class="sidebar__icon">📁</span>Material
        </a>
        <a href="{{ url_for('sesiones') }}" class="sidebar__link {{ 'sidebar__link--active' if active_nav == 'sesiones' else '' }}">
          <span class="sidebar__icon">🗓️</span>Sesiones
        </a>
      </nav>
    </aside>

    <div class="main">

      <header class="topbar">
        <button type="button" class="topbar__toggle" id="sidebarToggle" aria-label="Mostrar/ocultar menú">☰</button>

        <div class="profile">
          <button type="button" class="profile__trigger" id="profileTrigger">
            <div class="profile__avatar">{{ user.initials }}</div>
            <div class="profile__info">
              <div class="profile__name">{{ user.name }}</div>
              <div class="profile__role">{{ user.role }}</div>
            </div>
            <span class="profile__caret">▾</span>
          </button>
          <div class="profile__menu" id="profileMenu">
            <a href="#">Mi perfil</a>
            <a href="#">Configuración</a>
            <a href="#">Ayuda</a>
            <div class="profile__menu-divider"></div>
            <a href="#" class="profile__menu-danger">Cerrar sesión</a>
          </div>
        </div>
      </header>

      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
