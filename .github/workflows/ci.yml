name: quality

on:
  push: {}
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: ruff check .
      - run: bandit -q -r maxcim app.py wsgi.py
      - run: pytest --cov=maxcim --cov-report=term-missing --cov-fail-under=75
